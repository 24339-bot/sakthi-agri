{% extends "base.html" %}

{% block title %}Add Godown - Sakthi Agri{% endblock %}

{% block content %}
<div class="dashboard-wrapper">
    <div class="top-header">
        <div class="header-title-box">
            <h1><i class="bi bi-building" style="color: #166534; margin-right: 6px;"></i> Add Godown / Storage Facility</h1>
            <p>List cold storage or grain warehouses for local farmers.</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('godown_dashboard') }}" class="btn btn-outline" style="display: inline-flex; align-items: center; gap: 6px;">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="card-title">
            <i class="bi bi-building-gear" style="color: #166534; margin-right: 6px;"></i> Facility Specifications
        </div>

        <form action="{{ url_for('add_godown') }}" method="POST">
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="godown_name">Warehouse / Cold Storage Name *</label>
                    <input type="text" id="godown_name" name="godown_name" class="form-control" placeholder="e.g. Sri Sakthi Modern Cold Storage" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="godown_type">Storage Type *</label>
                    <select id="godown_type" name="godown_type" class="form-control" required>
                        <option value="Cold Storage">Cold Storage (Perishables, Fruits, Vegetables)</option>
                        <option value="Dry Warehouse" selected>Dry Ventilated Warehouse (Grains, Paddy)</option>
                        <option value="Grain Silo">Grain Silo Storage</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="total_capacity">Total Capacity *</label>
                    <input type="number" step="1" id="total_capacity" name="total_capacity" class="form-control" placeholder="e.g. 500" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="available_capacity">Available Capacity *</label>
                    <input type="number" step="1" id="available_capacity" name="available_capacity" class="form-control" placeholder="e.g. 350" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="capacity_unit">Capacity Unit *</label>
                    <select id="capacity_unit" name="capacity_unit" class="form-control" required>
                        <option value="Tons" selected>Tons</option>
                        <option value="Bags">Bags (50kg/75kg)</option>
                        <option value="Sq Ft">Square Feet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="rent_rate">Monthly Rental Rate (₹) *</label>
                    <input type="number" step="1" id="rent_rate" name="rent_rate" class="form-control" placeholder="e.g. 120" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="location">Location / Landmark *</label>
                    <input type="text" id="location" name="location" class="form-control" value="{{ session.get('district', 'thenkasi') }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact_phone">Contact Phone *</label>
                    <input type="tel" id="contact_phone" name="contact_phone" class="form-control" value="{{ session.get('phone', '') }}" required>
                </div>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;">
                    <input type="checkbox" name="temperature_controlled" value="1">
                    <span>Temperature & Humidity Controlled Facility (Cold Chain)</span>
                </label>
            </div>

            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit" class="btn btn-orange btn-lg" style="display: inline-flex; align-items: center; gap: 6px;">
                    <i class="bi bi-plus-lg"></i> Publish Godown Facility
                </button>
                <a href="{{ url_for('godown_dashboard') }}" class="btn btn-outline btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
